# Development Profile Configuration
server.port=${PORT:8080}

# Optional local overrides for machine-specific secrets (git-ignored)
spring.config.import=optional:classpath:application-local.properties,optional:file:application-local.properties

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mobility_wallet?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Session Configuration
server.servlet.session.timeout=30m

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# DEV-ONLY SEED CREDENTIALS (DO NOT USE IN PRODUCTION ENVIRONMENTS)
mobility.seed.admin.name=System Administrator
mobility.seed.admin.email=admin@mobility.com
mobility.seed.admin.password=admin123
mobility.seed.admin.phone=9876500000

mobility.seed.user.name=John Doe
mobility.seed.user.email=user@mobility.com
mobility.seed.user.password=user123
mobility.seed.user.phone=9876511111
mobility.seed.user.initial-balance=750.00
