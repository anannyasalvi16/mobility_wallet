# ==============================================================================
# Mobility Wallet Platform - Production Profile Configuration (application-prod.properties)
# ==============================================================================

# Server & Network Configuration
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.timeout=30m

# Database Configuration (100% sourced from environment variables; zero hardcoded secrets)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Cloud Connection Tuning (Fast Boot on Throttled Cloud CPU)
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=-1

# JPA & Hibernate Configuration (Bypass remote JDBC metadata roundtrips on boot)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.open-in-view=false

# Flyway Production Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Error Page Security (Never leak stack traces, exceptions, or internal details)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Thymeleaf Template Engine Caching (Enabled for production performance)
spring.thymeleaf.cache=true

# Spring Boot Actuator Configuration (Health Check for Host / Cloud Monitoring)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Production Administrator Seed Configuration (Sourced ONLY from environment variables)
mobility.seed.admin.email=${ADMIN_EMAIL:}
mobility.seed.admin.password=${ADMIN_PASSWORD:}
mobility.seed.admin.name=${ADMIN_NAME:System Administrator}
mobility.seed.admin.phone=${ADMIN_PHONE:0000000000}
