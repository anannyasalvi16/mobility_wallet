# ==============================================================================
# Mobility Wallet Platform - Production Profile Configuration (application-prod.properties)
# ==============================================================================

# Server & Network Configuration
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.timeout=30m

# Database Configuration (100% sourced from environment variables; zero hardcoded secrets)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Error Page Security (Never leak stack traces, exceptions, or internal details)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Thymeleaf Template Engine Caching (Enabled for production performance)
spring.thymeleaf.cache=true

# Spring Boot Actuator Configuration (Health Check for Host / Cloud Monitoring)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Production Administrator Seed Configuration (Sourced ONLY from environment variables)
mobility.seed.admin.email=${ADMIN_EMAIL:}
mobility.seed.admin.password=${ADMIN_PASSWORD:}
mobility.seed.admin.name=${ADMIN_NAME:System Administrator}
mobility.seed.admin.phone=${ADMIN_PHONE:0000000000}
