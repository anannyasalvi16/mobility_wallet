<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <style>
    @import url('/css/theme.css');
  </style>
  <!-- Two lit rays above the sign -->
  <line x1="24" y1="13" x2="20" y2="7" stroke="var(--color-accent)" stroke-width="3.5" stroke-linecap="round" />
  <line x1="40" y1="13" x2="44" y2="7" stroke="var(--color-accent)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Taxi roof-light glowing in yellow on dark background -->
  <rect x="12" y="18" width="40" height="26" rx="8" fill="var(--color-accent)" />

  <!-- Base and two mounting feet in text-on-dark -->
  <rect x="16" y="44" width="32" height="4.5" rx="2" fill="var(--color-text-on-dark)" />
  <rect x="21" y="48.5" width="5.5" height="4.5" rx="1.5" fill="var(--color-text-on-dark)" />
  <rect x="37.5" y="48.5" width="5.5" height="4.5" rx="1.5" fill="var(--color-text-on-dark)" />

  <!-- Bold rupee symbol (₹) in deep navy (text on yellow is always navy) -->
  <line x1="25" y1="24.5" x2="39" y2="24.5" stroke="var(--color-primary)" stroke-width="3" stroke-linecap="round" />
  <line x1="25" y1="29" x2="36" y2="29" stroke="var(--color-primary)" stroke-width="3" stroke-linecap="round" />
  <path d="M 28 24.5 L 28 34 C 34.5 34 34.5 24.5 28 24.5" fill="none" stroke="var(--color-primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="29.5" y1="33.5" x2="37.5" y2="40" stroke="var(--color-primary)" stroke-width="3" stroke-linecap="round" />
</svg>
