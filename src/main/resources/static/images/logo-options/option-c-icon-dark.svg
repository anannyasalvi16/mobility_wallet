<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <style>
    @import url('/css/theme.css');
  </style>
  <!-- Rounded-square app-icon container in solid deep navy with yellow accent outline -->
  <rect x="4" y="4" width="56" height="56" rx="15" fill="var(--color-primary)" stroke="var(--color-accent)" stroke-width="2.5" />

  <!-- Subtle wallet outline inside container -->
  <rect x="9" y="11" width="46" height="42" rx="8" fill="none" stroke="var(--color-text-on-dark)" stroke-width="2" stroke-opacity="0.35" />
  <path d="M 9 22 Q 26 25 50 21" fill="none" stroke="var(--color-text-on-dark)" stroke-width="2" stroke-opacity="0.35" stroke-linecap="round" />

  <!-- Wallet clasp in yellow -->
  <rect x="47" y="26.5" width="8" height="11" rx="3" fill="var(--color-accent)" />
  <circle cx="50.5" cy="32" r="1.3" fill="var(--color-primary)" />

  <!-- Lit rays above taxi roof light -->
  <line x1="26" y1="22" x2="23" y2="18" stroke="var(--color-accent)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="38" y1="22" x2="41" y2="18" stroke="var(--color-accent)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Yellow roof light -->
  <rect x="27" y="25" width="10" height="4" rx="2" fill="var(--color-accent)" />

  <!-- Recognisable side-view taxi in yellow -->
  <path d="M 14 43 L 14 39 C 14 38 15 37 16 37 L 22 37 L 26 30 C 27 29 28.5 29 30 29 L 37 29 C 38.5 29 39.5 29.5 40.5 30.5 L 44 36 L 47 36 C 48 36 49 37 49 38 L 49 41 Z" fill="var(--color-accent)" />

  <!-- Cabin window in deep navy (contrast on yellow) -->
  <path d="M 28 32 L 35 32 L 38 36 L 25 36 Z" fill="var(--color-primary)" />

  <!-- Two wheels in navy with yellow rim -->
  <circle cx="22" cy="43" r="4.5" fill="var(--color-primary)" stroke="var(--color-accent)" stroke-width="2.5" />
  <circle cx="42" cy="43" r="4.5" fill="var(--color-primary)" stroke="var(--color-accent)" stroke-width="2.5" />
</svg>
