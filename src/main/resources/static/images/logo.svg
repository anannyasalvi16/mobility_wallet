<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 52" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --color-primary: #0F172A;
        --color-accent: #FACC15;
        --color-bg: #F8FAFC;
        --color-text-on-dark: #F8FAFC;
      }
    </style>
  </defs>
  <g transform="translate(2, 3) scale(0.88)">
    <!-- Wallet outline -->
    <rect x="6" y="8" width="52" height="48" rx="10" fill="none" stroke="#0F172A" stroke-width="3.5" />
    <path d="M 6 22 Q 28 25 58 20" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" />
    <rect x="52" y="27" width="8" height="12" rx="3.5" fill="#EAB308" stroke="#0F172A" stroke-width="2" />
    <circle cx="55.5" cy="33" r="1.5" fill="#0F172A" />

    <!-- Taxi inside -->
    <rect x="27" y="25.5" width="10" height="4" rx="2" fill="#EAB308" stroke="#0F172A" stroke-width="1.5" />
    <path d="M 14 43 L 14 39 C 14 38 15 37 16 37 L 22 37 L 26 30 C 27 29 28.5 29 30 29 L 37 29 C 38.5 29 39.5 29.5 40.5 30.5 L 45 37 L 48 37 C 49 37 50 38 50 39 L 50 43 Z" fill="#0F172A" />
    <path d="M 28 32 L 35 32 L 38 36 L 25 36 Z" fill="#F8FAFC" />
    <circle cx="22" cy="43" r="4.5" fill="#F8FAFC" stroke="#0F172A" stroke-width="3" />
    <circle cx="42" cy="43" r="4.5" fill="#F8FAFC" stroke="#0F172A" stroke-width="3" />
  </g>

  <!-- Wordmark "Mobility Wallet" with high-contrast amber for light background -->
  <text x="60" y="34" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#0F172A">Mobility </tspan>
    <tspan fill="#CA8A04">Wallet</tspan>
  </text>
</svg>
